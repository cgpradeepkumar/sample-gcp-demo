name: Sample GCP Demo Deploy

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  GKE_CLUSTER: sample-gcp-demo-cluster
  GKE_ZONE_OR_REGION: us-central1
  DEPLOYMENT_NAME: sample-gcp-gateway
  NAMESPACE: default
  DOCKER_IMAGE_NAME: cgpradeepkumar/sample-gcp-gateway
  DOCKER_IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          version: latest

      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE Credentials
        run: gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --zone ${{ env.GKE_ZONE_OR_REGION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Deploy with Helm
        run: |
          IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
          echo "Deploying image tag: $IMAGE_TAG"

          helm upgrade --install sample-gcp-gateway ./charts \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }} \
            --set image.tag=$IMAGE_TAG \
            --namespace demo --create-namespace

